name: Timora checks
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: timora-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install isolated browser test tools
        run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        timeout-minutes: 5
      - run: npm run test:browser:desktop
        timeout-minutes: 5
      - run: npm run test:browser:android
        timeout-minutes: 5
      - run: npm run test:browser:native-account
        timeout-minutes: 5
      - name: Browser review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: test-results/
          if-no-files-found: ignore
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: timora_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-test-only
      PGDATABASE: timora_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/db-bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/migrations/002_project_foreign_key_indexes.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/migrations/003_profile_identity.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/migrations/20261010030830_native_workspace_sync.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/sync.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/rls.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/profile-rls.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path src-tauri/Cargo.toml --example sync_driver --no-default-features --locked
      - name: Install isolated PostgreSQL integration test adapter
        run: npm install --prefix "$RUNNER_TEMP/timora-db-tools" pg@8.16.3
      - name: Two-device SQLite and PostgreSQL synchronization
        run: TIMORA_PG_MODULE="$RUNNER_TEMP/timora-db-tools/node_modules/pg/lib/index.js" node tests/sync-integration.mjs

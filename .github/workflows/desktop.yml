name: Timora Desktop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timora-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Windows Rust build output
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-timora-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features
      # No Supabase secrets/configuration: local startup must be independent.
      - run: npm run desktop:build -- --ci -- --locked
      - name: Windows executable and offline-capable NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: timora-v0.3-windows-x64
          path: |
            src-tauri/target/release/timora-desktop.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

[package]
name = "timora-desktop"
version = "0.3.0"
edition = "2021"

[lib]
name = "timora_local"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "timora-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:reqwest", "dep:dotenvy", "dep:keyring"]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
dotenvy = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"], optional = true }
